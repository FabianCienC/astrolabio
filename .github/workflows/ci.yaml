name: ci

# One job per folder; each runs only when its folder changed. Pull requests only
# check; a push to main also builds, scans and pushes the image, then bumps its
# tag in homelab-gitops so Argo CD deploys it.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.diff.outputs.api }}
      web: ${{ steps.diff.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # GitHub's `paths` filters whole workflows, so changes are detected per folder here.
      # The contract and the CI itself feed both sides, so changing them checks both.
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=$(printf 'api/\nweb/')  # first push or rewritten history: check everything
          else
            files=$(git diff --name-only "$BASE" "$GITHUB_SHA")
          fi
          changed() { printf '%s\n' "$files" | grep -qE "$1" && echo true || echo false; }
          echo "api=$(changed '^(api|contract)/|^\.github/(workflows|scripts)/')" >> "$GITHUB_OUTPUT"
          echo "web=$(changed '^(web|contract)/|^\.github/(workflows|scripts)/')" >> "$GITHUB_OUTPUT"

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/fabiancienc/astrolabio-api
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.22"

      - name: Lint y tests
        run: |
          uv sync --locked
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest

      - name: Construir imagen
        run: docker build -t "$IMAGE:$GITHUB_SHA" .

      - name: Escanear con Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Login a GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Subir imagen
        if: github.event_name == 'push'
        run: docker push "$IMAGE:$GITHUB_SHA"

      - name: Actualizar el tag en homelab-gitops
        if: github.event_name == 'push'
        working-directory: .
        env:
          DEPLOY_KEY: ${{ secrets.GITOPS_DEPLOY_KEY }}
          IMAGE_NAME: astrolabio-api
        run: bash .github/scripts/bump-gitops.sh

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/fabiancienc/astrolabio-web
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Tipos y build
        run: |
          npm ci
          npm run gen:contract
          git diff --exit-code src/contract/  # the TS types match the committed schema
          npm run build

      # The context is the repo root: the build reads the contract from ../contract.
      - name: Construir imagen
        working-directory: .
        run: docker build -f web/Dockerfile -t "$IMAGE:$GITHUB_SHA" .

      - name: Escanear con Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Login a GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Subir imagen
        if: github.event_name == 'push'
        run: docker push "$IMAGE:$GITHUB_SHA"

      - name: Actualizar el tag en homelab-gitops
        if: github.event_name == 'push'
        working-directory: .
        env:
          DEPLOY_KEY: ${{ secrets.GITOPS_DEPLOY_KEY }}
          IMAGE_NAME: astrolabio-web
        run: bash .github/scripts/bump-gitops.sh
