# astrolabio-web: the built single-page app. /api and /ws never reach here (the
# HTTPRoute sends them to the API).
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Vite fingerprints asset names, so they can be cached for good.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The app is a single page with no routes of its own: only / serves it, and it always
    # revalidates, so a new deploy shows up on reload.
    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # Real files only (favicon...); anything else is a real 404, not the page in disguise.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }
}
