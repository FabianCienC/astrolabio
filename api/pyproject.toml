[project]
name = "astrolabio-api"
version = "0.1.0"
description = "Astrolabio API: reads the cluster live and serves a sanitized galaxy"
readme = "README.md"
authors = [
    { name = "Fabian Cienfuegos", email = "fabian.cienfuegos.c@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.156.4",
    "kubernetes-asyncio>=36.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
export-contract = "astrolabio_api.contract.export:main"
snapshot-example = "astrolabio_api.contract.snapshot:main"

[build-system]
requires = ["uv_build>=0.11.22,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
